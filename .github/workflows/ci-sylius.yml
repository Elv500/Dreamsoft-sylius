name: CI - Run API Tests

on:
  workflow_dispatch:
    inputs:
      marker:
        description: 'Insert Marker or Suite'
        required: false
        default: ''

  pull_request:
    branches:
      - development

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Establecer variables de entorno desde secrets
        run: |
          echo "BASE_URL=${{ secrets.BASE_URL }}" >> $GITHUB_ENV
          echo "ADMIN_USERNAME=${{ secrets.ADMIN_EMAIL }}" >> $GITHUB_ENV
          echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}" >> $GITHUB_ENV

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar tests con pytest y generar reporte Allure
        run: |
          if [ -n "${{ github.event.inputs.marker }}" ]; then
            echo "Ejecutando pytest con marker: ${{ github.event.inputs.marker }}"
            pytest --disable-warnings -v ${{ github.event.inputs.marker }} --alluredir=reports/allure-results
          else
            echo "Ejecutando todos los tests"
            pytest --disable-warnings -v --alluredir=reports/allure-results
          fi

      - name: Load test report history
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: report-allure
          path: report-allure

      - name: Build test report
        uses: simple-elf/allure-report-action@v1.7
        if: always()
        with:
          gh_pages: report-allure
          allure_results: reports/allure-results
          allure_history: allure-history

      - name: Publish test report
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: report-allure
          publish_dir: allure-history